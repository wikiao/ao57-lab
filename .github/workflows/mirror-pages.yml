name: Mirror ChatGPT Site to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin ChatGPT Sites origin
        shell: bash
        run: |
          set -euo pipefail
          # Keep fetching the current ChatGPT Sites origin even after public DNS
          # for ao-57.ru is moved to GitHub Pages.
          echo "162.159.143.30 ao-57.ru" | sudo tee -a /etc/hosts
          echo "172.66.3.26 ao-57.ru" | sudo tee -a /etc/hosts

      - name: Verify upstream
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSIL --max-time 20 https://ao-57.ru/ | head -n 20

      - name: Mirror published ChatGPT Site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _mirror _heart
          mkdir -p _mirror _site

          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --directory-prefix=_mirror \
            --execute robots=off \
            https://ao-57.ru/

          cp -a _mirror/. _site/

          wget \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --directory-prefix=_heart \
            --execute robots=off \
            https://ao-57.ru/heart-of-rus || true

          if [ -d _heart ]; then
            cp -an _heart/. _site/ || true
          fi

          touch _site/.nojekyll
          echo "ao-57.ru" > _site/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
